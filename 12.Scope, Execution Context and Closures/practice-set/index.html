<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toaster Notification</title>
    <style>
        body {
            height: 100vh;
            margin: 0;
            background-color: black;
        }

        .toast {
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 30px;
            left: 50px;
            gap: 10px;
        }
        
        
        .fixed {
            background-color: gray;
            padding: 6px;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="toast">

    </div>


    <script src="script.js"></script>
</body>

</html>
